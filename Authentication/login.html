<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta Tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
 
        <!-- Title -->
        <title>Log In — T'S PMS</title>
 
        <!-- Description -->
        <meta name="description" content="Log in to T'S PMS to manage your team's projects.">
 
        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
 
        <!-- Web fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
 
        <!-- CSS Stylesheets -->
        <link rel="stylesheet" type="text/css" href="../css/style.css">
        <link rel="stylesheet" type="text/css" href="../css/auth.css">
 
    </head>
    <body class="auth-page">
 
        <div class="auth-bg-blobs" aria-hidden="true">
            <span class="blob blob-1"></span>
            <span class="blob blob-2"></span>
            <span class="blob blob-3"></span>
        </div>
        <div class="cursor-spotlight" aria-hidden="true"></div>
 
        <a href="../index.html" class="auth-back">
            <i class="uil uil-arrow-left"></i>
            <span>Back to home</span>
        </a>
 
        <div class="auth-wrapper">
            <div class="auth-card">
 
                <div class="auth-logo">
                    <img src="../images/logo.svg" alt="T'S PMS logo">
                </div>
 
                <h1>Welcome back</h1>
                <p class="auth-subtext">Please sign in to continue</p>
 
                <form id="login-form" class="auth-form" novalidate>
 
                    <div class="form-group has-icon">
                        <label for="login-email" class="sr-only">Email address</label>
                        <i class="uil uil-envelope" aria-hidden="true"></i>
                        <input type="email" id="login-email" name="email" placeholder="Email address" autocomplete="email" required>
                    </div>
 
                    <div class="form-group has-icon">
                        <label for="login-password" class="sr-only">Password</label>
                        <i class="uil uil-lock" aria-hidden="true"></i>
                        <input type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
                        <button type="button" class="input-toggle" id="toggle-login-password" aria-label="Show password">
                            <i class="uil uil-eye" aria-hidden="true"></i>
                        </button>
                    </div>
 
                    <div class="auth-row">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="forgot-password.html" class="auth-link">Forgot password?</a>
                    </div>
 
                    <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
 
                </form>
 
                <div class="auth-divider"><span>or continue with</span></div>
 
                <div class="auth-social">
                    <button type="button" class="social-btn" aria-label="Continue with Google">G</button>
                    <button type="button" class="social-btn" aria-label="Continue with GitHub">Gh</button>
                    <button type="button" class="social-btn" aria-label="Continue with X">X</button>
                </div>
 
                <p class="auth-footer-text">Don't have an account? <a href="register.html">Sign up</a></p>
 
            </div>
        </div>
 
        <script src="../js/auth.js"></script>
 
    </body>
</html>
